<style>

.sub{color:var(--mut);margin:0 0 12px;font-size:.88rem}

.tab{font:inherit;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:15px;padding:8px 4px;line-height:1.25}

button:focus-visible,a:focus-visible{outline:3px solid var(--a);outline-offset:2px}

.dp{font-size:.78rem;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;white-space:nowrap}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding-left:38px}

.tl li:only-child::before{display:none}
.dot{position:absolute;left:5px;top:12px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:var(--card);border:4px solid var(--a);z-index:1;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,background .2s}

.stop{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:10px 0}
.stop .t{font-weight:700;color:var(--at);font-size:.9rem}
.stop .n{font-weight:600;font-size:1.02rem}
.stop .s{color:var(--mut);font-size:.85rem}
.panel{margin:0 0 10px;background:var(--card);border:1px solid var(--a);border-radius:16px;padding:12px 14px;box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 30%,transparent),0 10px 30px -10px color-mix(in srgb,var(--a) 55%,transparent)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.map small{font-weight:400;font-size:.7rem;color:var(--mut)}
.ic{font-size:1.5rem;line-height:1.1}
.go{grid-column:1/-1;color:#0a0d12;background:var(--a);border-radius:14px;padding:12px 14px;transition:transform .15s,box-shadow .2s}

.map:hover,.go:hover{box-shadow:0 0 16px -2px var(--a)}
.next{color:var(--mut);font-size:.8rem;margin:8px 0 0}
.mp{width:100%;height:auto;display:block;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin:0 0 6px}

.sum{font-weight:700;margin:0 0 8px}
.or{display:flex;gap:10px;align-items:center;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:border-color .2s,box-shadow .2s}

.nb{flex:none;width:28px;height:28px;border-radius:50%;background:var(--a);color:#0a0d12;font-weight:800;font-size:.8rem;display:grid;place-items:center}

.rtag{font-weight:700;font-size:.8rem;color:var(--gt);background:color-mix(in srgb,var(--g) 14%,transparent);border:1px solid color-mix(in srgb,var(--g) 35%,transparent);border-radius:12px;padding:6px 12px}

.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:color-mix(in srgb,var(--ink) 4%,var(--bg));border:1px solid var(--line);border-radius:16px;padding:10px;margin:0 0 12px}
.chip{font:inherit;font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;transition:border-color .2s,box-shadow .2s}

.ar{color:var(--mut)}

.big:active{transform:scale(.98)}
.alt{display:block;text-align:center;color:var(--mut);font-size:.78rem;margin-top:10px;text-decoration:underline}

.pg{display:flex;align-items:center;gap:10px;margin:0 0 6px}

  $("saved").innerHTML='<details class="tl2"'+(op?' open':'')+'><summary><span>⭐ Saved places <small class="cnt">'+PL.length+tr(" ร้าน"," places")+(FV.length?' · ⭐ '+FV.length:'')+(BK.length?' · 🛟 '+BK.length:'')+'</small></span></summary><div class="tb"><p class="sum2">'+tr("แยกตามย่าน · ⭐ = ร้านที่อยากไป · 🛟 = ร้านสำรองเมื่อร้านปิดหรือคนเยอะ · เก็บไว้ในเบราว์เซอร์ของเครื่องนี้","Grouped by area · ⭐ = want to go · 🛟 = backup for when a place is closed or crowded · saved in this device’s browser")+'</p><div class="fcs">'+cs.map(function(c){return '<button class="fc" data-sf="'+c[0]+'" aria-pressed="'+(SF==c[0])+'">'+esc(c[1])+'</button>'}).join("")+'</div>'+(h||'<p class="sum2">'+tr("ยังไม่มีรายการ กด ⭐ หรือ 🛟 ที่การ์ดร้านเพื่อเพิ่ม","Nothing here yet. Tap ⭐ or 🛟 on a place card to add it.")+'</p>')+'</div></details>';
}
function applyTheme(){document.documentElement.setAttribute("data-theme",TH);$("tc").setAttribute("content",TH=="light"?"#f1f4f8":"#0a0d12")}
document.addEventListener("click",function(e){
  if(e.target.id=="tx"){TX=null;txRender();return}
  var t=e.target.closest("button");if(!t)return;var d=t.dataset;
  if(d.l){L=d.l;sv("sl",L);render(false);toolsHtml();savedHtml()}
  else if(d.th){TH=d.th;sv("st",TH);applyTheme();render(false)}
  else if(d.d!==undefined){di=+d.d;si=0;TX=null;render(false);window.scrollTo(0,0)}
  else if(d.i!==undefined){si=(+d.i==si)?-1:+d.i;render(false)}
  else if(d.j!==undefined){si=+d.j;render(true)}
  else if(d.c!==undefined){var k=di+"-"+d.c;if(DN[k])delete DN[k];else DN[k]=1;ss("dn",DN);render(false)}
  else if(d.n){if(si<D[di].s.length-1){si++}else if(di<D.length-1){di++;si=0}else{di=0;si=0}render(true);if(si==0)window.scrollTo(0,0)}
  else if(d.tx!==undefined){TX=+d.tx;TXE=false;txRender()}
  else if(d.x){TX=null;txRender()}
  else if(d.cp){cpy(krTxt(D[di].s[TX]),t)}
  else if(d.te){TXE=true;txRender()}
  else if(d.sv){var v=$("txt").value.trim(),q=D[di].s[TX][4];if(v)KR[q]=v;else delete KR[q];ss("kr",KR);TXE=false;txRender()}
  else if(d.fv){tg(FV,d.fv,"fv")}
  else if(d.bk){tg(BK,d.bk,"bk")}
  else if(d.sf){SF=d.sf;savedHtml()}
  else if(d.ad){var a=parseFloat($("ea").value.replace(",","."));if(!(a>0))return;EX.push({d:$("ed").value.trim()||tr("ค่าใช้จ่าย","Expense"),a:a,c:$("ec").value});ss("ex",EX);$("ed").value="";$("ea").value="";exList()}
  else if(d.del!==undefined){EX.splice(+d.del,1);ss("ex",EX);exList()}
});
document.addEventListener("input",function(e){var id=e.target.id;if(id=="rt"){RT=e.target.value;ss("rt",RT);cvt("cw");exList()}else if(id=="cw"||id=="cb")cvt(id)});
document.addEventListener("keydown",function(e){if(e.key=="Escape"&&TX!==null){TX=null;txRender()}});
applyTheme();render(false);toolsHtml();savedHtml();
</script>
